<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>통근권 집찾기 · 이용 통계</title>
<style>
  :root { --ink: #1f2b3d; --ink2: #5b6676; --rule: #e3e7ee; --bg: #f5f7fa; --acc: #2f6f5e; --acc2: #9cc9b8; --warn: #b45309; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--ink); background: var(--bg); }
  header { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid var(--rule); padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .seg button { font: inherit; border: 0; background: #fff; padding: 5px 11px; cursor: pointer; color: var(--ink2); }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .key { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .key input { font: inherit; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 8px; width: 150px; }
  .key button { font: inherit; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 20px 60px; }
  .msg { background: #fff; border: 1px solid var(--rule); border-radius: 12px; padding: 18px; color: var(--ink2); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: #fff; border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--ink2); font-size: 12.5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .card { background: #fff; border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { font-size: 14.5px; margin: 0 0 2px; }
  .card p.d { margin: 0 0 10px; color: var(--ink2); font-size: 12px; }
  .bars { display: grid; grid-template-columns: minmax(80px, 42%) 1fr auto; gap: 4px 8px; align-items: center; font-size: 12.5px; }
  .bars .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars .t { height: 12px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .bars .t i { display: block; height: 100%; background: var(--acc); border-radius: 3px; }
  .bars .v { font-variant-numeric: tabular-nums; color: var(--ink2); text-align: right; min-width: 52px; }
  .none { color: var(--ink2); font-size: 12.5px; }
  svg text { font-size: 11px; fill: var(--ink2); }
  .legend { font-size: 12px; color: var(--ink2); display: flex; gap: 14px; margin-top: 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .funnel .bars .t i { background: var(--acc2); }
  footer { color: var(--ink2); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<header>
  <h1>이용 통계</h1>
  <div class="seg" id="days"><button data-v="7">7일</button><button data-v="30" aria-pressed="true">30일</button><button data-v="90">90일</button><button data-v="365">1년</button></div>
  <div class="seg" id="site"><button data-v="" aria-pressed="true">전체</button><button data-v="cf">본 사이트</button><button data-v="gh">github.io</button><button data-v="preview">미리보기</button></div>
  <form class="key" id="keyf"><input id="key" type="password" placeholder="통계 열쇠" autocomplete="current-password"><button>보기</button></form>
</header>
<main id="out"><div class="msg">통계 열쇠를 넣고 ‘보기’를 누르세요.</div></main>
<script>
(() => {
  const $ = (s) => document.querySelector(s), API = location.hostname.endsWith('github.io') ? 'https://doorto.pages.dev/api/stats' : '/api/stats';
  const st = { days: 30, site: '', key: '' };
  try { st.key = localStorage.getItem('dt-stats-key') || ''; $('#key').value = st.key; } catch (e) { /* 저장 안 됨 */ }
  const esc = (x) => String(x ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = (n) => (n == null ? '–' : Number(n).toLocaleString('ko-KR'));
  const pct = (a, b) => (b ? `${Math.round((a / b) * 100)}%` : '–');
  let stations = null, apts = null;
  async function refs() {
    if (!stations) stations = await fetch('data/stations.json').then((r) => r.json()).catch(() => []);
    if (!apts) apts = await fetch('data/apts.json').then((r) => r.json()).then((c) => { const m = new Map(); c.seq.forEach((s, i) => m.set(s, `${c.name[i]} (${c.dong[i]})`)); return m; }).catch(() => new Map());
  }
  function nearSt(lat, lon) { let b = null, bd = 1e9; for (const [n, y, x] of stations || []) { const d = (y - lat) ** 2 + ((x - lon) * 0.8) ** 2; if (d < bd) { bd = d; b = n; } } return b; }
  const workName = (k) => { if (!k) return '–'; if (k.startsWith('역:')) return k.slice(2); const [y, x] = k.slice(2).split(',').map(Number); const n = nearSt(y, x); return n ? `${n} 부근 (약 3km 칸)` : k; };
  function bars(rows, opt = {}) {
    if (!rows || !rows.length) return '<p class="none">아직 기록이 없어요.</p>';
    const tot = opt.total || rows.reduce((s, r) => s + r.v, 0), mx = Math.max(...rows.map((r) => r.v));
    return `<div class="bars">${rows.map((r) => `<span class="l" title="${esc(r.k)}">${esc(r.k)}</span><span class="t"><i style="width:${(r.v / mx) * 100}%"></i></span><span class="v">${fmt(r.v)}${opt.noPct ? '' : ` · ${pct(r.v, tot)}`}</span>`).join('')}</div>`;
  }
  const card = (t, d, body, wide) => `<section class="card${wide ? ' wide' : ''}"><h2>${t}</h2>${d ? `<p class="d">${d}</p>` : ''}${body}</section>`;
  function daily(rows, days) {
    // 빈 날도 0으로 채운 일별 막대(방문) + 선(직장 지정)
    const end = new Date(Date.now() + 9 * 3600e3), m = new Map(rows.map((r) => [r.day, r])), L = [];
    for (let i = days - 1; i >= 0; i--) { const d = new Date(end - i * 86400e3).toISOString().slice(0, 10); L.push(m.get(d) || { day: d, visits: 0, works: 0 }); }
    const W = 1100, Hh = 180, pad = 28, mx = Math.max(1, ...L.map((r) => r.visits)), bw = (W - pad) / L.length;
    const y = (v) => Hh - 18 - (v / mx) * (Hh - 34);
    const barsSvg = L.map((r, i) => `<rect x="${pad + i * bw + 1}" y="${y(r.visits)}" width="${Math.max(1, bw - 2)}" height="${Hh - 18 - y(r.visits)}" fill="#9cc9b8"><title>${r.day} 방문 ${r.visits} · 직장 지정 ${r.works || 0}</title></rect>`).join('');
    const wmx = Math.max(1, ...L.map((r) => r.works || 0));
    const line = L.map((r, i) => `${pad + i * bw + bw / 2},${Hh - 18 - ((r.works || 0) / Math.max(wmx, mx)) * (Hh - 34)}`).join(' ');
    const step = Math.ceil(L.length / 8), ticks = L.map((r, i) => (i % step === 0 ? `<text x="${pad + i * bw}" y="${Hh - 4}">${r.day.slice(5).replace('-', '.')}</text>` : '')).join('');
    return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="일별 방문"><text x="0" y="12">${mx}</text><line x1="${pad}" x2="${W}" y1="${Hh - 18}" y2="${Hh - 18}" stroke="#e3e7ee"/>${barsSvg}<polyline points="${line}" fill="none" stroke="#2f6f5e" stroke-width="2"/>${ticks}</svg>
      <div class="legend"><span><i style="background:#9cc9b8"></i>방문(탭 기준)</span><span><i style="background:#2f6f5e"></i>직장 지정 횟수</span></div>`;
  }
  const KIND = { sale: '매매', jeonse: '전세', rent: '월세' };
  const MODES = (m) => { const n = ['지하철', '기차', '광역버스', '시내버스'].filter((_, i) => m[i] === '1'); return n.length === 4 ? '모두' : n.join('+'); };
  function budLabel(kind, v) { if (v === '제한없음') return '제한 없음'; const x = +v; if (kind === 'rent') return `${x}만원 이하`; return `${x / 10000}억 이하`; }
  function condDist(rows) {
    // cond = 종류|최대시간|예산|면적|거래수|수단|환승|도보|맞벌이|가격구간|최적
    const acc = { kind: {}, lim: {}, bud: {}, area: {}, modes: {}, tr: {}, walk: {}, couple: {}, best: {} };
    const add = (k, v, w) => { acc[k][v] = (acc[k][v] || 0) + w; };
    for (const r of rows) {
      const p = String(r.k).split('|'); if (p.length < 11) continue; const w = r.v;
      add('kind', KIND[p[0]] || p[0], w); add('lim', `${p[1]}분`, w); add('bud', `${KIND[p[0]] || ''} ${budLabel(p[0], p[2])}`, w); add('area', `${p[3]}㎡ 이상`, w);
      add('modes', MODES(p[5]), w); add('tr', p[6] === '-1' ? '제한 없음' : p[6] === '0' ? '환승 없이' : `${p[6]}회까지`, w);
      add('walk', p[7] === '0' ? '제한 없음' : `${p[7]}분까지`, w); add('couple', p[8] === 'A만' ? '혼자(A만)' : '맞벌이(A+B)', w);
      if (p[10] !== '-') { const [t, c, y] = p[10].slice(3).split('-').map(Number); add('best', `통근 ${t * 10} · 주거비 ${c * 10} · 연식 ${y * 10}`, w); }
    }
    const rowsOf = (o, sortKey) => { const a = Object.entries(o).map(([k, v]) => ({ k, v })); return sortKey ? a.sort(sortKey) : a.sort((x, y) => y.v - x.v); };
    const num = (x, y) => parseFloat(x.k) - parseFloat(y.k);
    return { kind: rowsOf(acc.kind), lim: rowsOf(acc.lim, num), bud: rowsOf(acc.bud).slice(0, 12), area: rowsOf(acc.area, num), modes: rowsOf(acc.modes), tr: rowsOf(acc.tr), walk: rowsOf(acc.walk), couple: rowsOf(acc.couple), best: rowsOf(acc.best).slice(0, 10) };
  }
  const NAME = { visit: '방문', work: '직장 지정', how: '직장 고르는 방법', cond: '조건 묶음', apt: '단지 선택', detail: '세부정보 열기', best: '최적의 집 찾기 켜고 끄기', tier: '순위 숨기기/보이기', route: '경로 보기', calc: '통근시간 계산', err: '오류', outside: '범위 밖 선택', nofind: '검색 결과 없음', tour: '안내 단계 보기', tourend: '안내 닫기', pmode: '가격 구간 방식 바꾸기', legend: '범례로 가격 고르기', hide: '화면 숨김', leave: '나가기' };
  const HOW = { st: '역 검색', place: '장소 검색', addr: '주소 검색', map: '지도에서 누름', link: '공유 링크로 열림' };
  const SITE = { cf: '본 사이트(doorto)', gh: 'github.io', preview: '미리보기', etc: '기타' };
  async function load() {
    const out = $('#out'); if (!st.key) { out.innerHTML = '<div class="msg">통계 열쇠를 넣고 ‘보기’를 누르세요.</div>'; return; }
    out.innerHTML = '<div class="msg">불러오는 중…</div>';
    let j;
    try {
      const r = await fetch(`${API}?days=${st.days}${st.site ? `&site=${st.site}` : ''}`, { headers: { 'x-key': st.key } });
      j = await r.json();
      if (r.status === 401) { out.innerHTML = '<div class="msg">통계 열쇠가 맞지 않아요.</div>'; return; }
      if (j.error === 'nodb') { out.innerHTML = '<div class="msg">통계 저장소가 아직 연결되지 않았어요.</div>'; return; }
      if (j.error === 'empty') { out.innerHTML = '<div class="msg">아직 쌓인 기록이 없어요. 사이트에 누군가 들어오면 바로 쌓이기 시작해요.</div>'; return; }
    } catch (e) { out.innerHTML = '<div class="msg">통계를 불러오지 못했어요. 잠시 뒤 다시 시도해 주세요.</div>'; return; }
    await refs();
    const f = j.funnel || {}, c = condDist(j.conds || []), N = Object.fromEntries((j.names || []).map((r) => [r.k, r]));
    const rt = Object.fromEntries((j.routes || []).map((r) => [r.k, r.v])), rtAll = (rt['배차경고'] || 0) + (rt['-'] || 0);
    const kpi = (v, t) => `<div class="kpi"><b>${v}</b><span>${t}</span></div>`;
    out.innerHTML = `<div class="kpis">
        ${kpi(fmt(f.visit), `방문(${j.from} 이후)`)}
        ${kpi(pct(f.work, f.visit), '직장까지 정한 방문')}
        ${kpi(pct(f.apt, f.visit), '단지를 눌러 본 방문')}
        ${kpi(pct(f.route, f.visit), '경로까지 본 방문')}
        ${kpi(pct(f.best, f.work), '최적의 집 찾기를 켠 비율(직장 정한 방문 중)')}
        ${kpi(pct(f.couple, f.work), '맞벌이(직장 B) 사용 비율')}
        ${kpi(j.calc && j.calc.c ? `${Math.round(j.calc.avg)}ms` : '–', '통근시간 계산 평균(기기에서)')}
      </div>
      <div class="grid">
        ${card('일별 방문', '방문은 탭(창) 하나를 한 번으로 셉니다. 같은 사람이 다음 날 다시 오면 다시 셉니다.', daily(j.daily || [], Math.min(j.days, 120)), true)}
        ${card('어디까지 써 봤나', '방문 중 각 단계까지 간 비율', `<div class="funnel">${bars([{ k: '들어옴', v: f.visit || 0 }, { k: '직장 정함', v: f.work || 0 }, { k: '단지 눌러 봄', v: f.apt || 0 }, { k: '경로 봄', v: f.route || 0 }], { total: f.visit })}</div>`)}
        ${card('머문 시간', '실제로 조작하며 화면을 본 시간(30초 넘게 가만있으면 멈춘 것으로 봄)', bars(['30초 미만', '30초~2분', '2~10분', '10분 이상'].map((k) => ({ k, v: (j.active || []).find((r) => r.k === k)?.v || 0 }))))}
        ${card('들어온 경로', '앞 페이지의 사이트 주소만(direct = 주소 직접 입력·즐겨찾기·앱 등)', bars(j.refs))}
        ${card('기기', '', bars((j.devs || []).map((r) => ({ k: { mobile: '휴대폰', tablet: '태블릿·좁은 창', desktop: 'PC' }[r.k] || r.k, v: r.v }))))}
        ${card('지역', 'Cloudflare가 알려 주는 시도 단위(한국 밖은 나라 코드)', bars(j.regions))}
        ${card('사이트별', '', bars((j.sites || []).map((r) => ({ k: SITE[r.k] || r.k, v: r.v }))))}
        ${card('많이 정한 직장', '역으로 고르면 역 이름, 그 밖에는 약 3km 칸을 가까운 역 이름으로 표시(방문 수)', bars((j.works || []).map((r) => ({ k: workName(r.k), v: r.v })), { noPct: true }), true)}
        ${card('직장 고르는 방법', '', bars((j.hows || []).map((r) => ({ k: HOW[r.k] || r.k, v: r.v }))))}
        ${card('거래 종류', '조건을 바꿔 본 경우 모두 포함(방문별)', bars(c.kind))}
        ${card('최대 통근시간', '', bars(c.lim))}
        ${card('예산', '', bars(c.bud))}
        ${card('전용면적', '', bars(c.area))}
        ${card('이동수단', '', bars(c.modes))}
        ${card('환승 조건', '', bars(c.tr))}
        ${card('도보 상한', '', bars(c.walk))}
        ${card('혼자 / 맞벌이', '', bars(c.couple))}
        ${card('최적의 집 찾기 비중', '켰을 때 고른 세 항목 비중(10% 단위)', bars(c.best))}
        ${card('많이 본 단지', '단지를 눌러 본 방문 수', bars((j.apts || []).map((r) => ({ k: apts.get(r.k) || r.k, v: r.v })), { noPct: true }), true)}
        ${card('목록 몇 번째 단지를 눌렀나', '목록 위쪽만 보는지, 아래까지 내려 보는지', bars(['1~3번째', '4~10번째', '11~30번째', '31번째 이후'].map((k) => ({ k, v: (j.aptRank || []).find((r) => r.k === k)?.v || 0 }))))}
        ${card('경로 보기', `경로를 본 ${fmt(rtAll)}번 중 배차 경고가 뜬 비율`, bars([{ k: '배차 간격 경고 있음', v: rt['배차경고'] || 0 }, { k: '경고 없음', v: rt['-'] || 0 }]))}
        ${card('“처음이시라면?” 안내', '몇 단계까지 봤나(방문 수)', bars((j.tours || []).map((r) => ({ k: `${r.k}단계`, v: r.v })), { noPct: true }) + `<p class="d" style="margin-top:8px">끝까지 봄 ${fmt((j.tourEnds || []).find((r) => r.k === 'done')?.v || 0)} · 중간에 닫음 ${fmt((j.tourEnds || []).find((r) => r.k === 'closed')?.v || 0)}</p>`)}
        ${card('검색에서 못 찾음', '검색어 자체는 모으지 않고 종류만', bars((j.nofind || []).map((r) => ({ k: r.k === '숫자포함' ? '숫자가 든 검색어(주소 등)' : '이름 검색어', v: r.v }))))}
        ${card('오류·범위 밖', '', bars((j.errs || []).map((r) => ({ k: r.k.replace(/^outside · /, '범위 밖 선택 · ').replace(/^calc · /, '계산 실패 · ').replace(/^js · /, '화면 오류 · '), v: r.v })), { noPct: true }))}
        ${card('기록 종류별 횟수', '모든 기록(횟수 / 방문 수)', `<div class="bars">${(j.names || []).map((r) => `<span class="l">${esc(NAME[r.k] || r.k)}</span><span class="t"><i style="width:${(r.v / Math.max(...j.names.map((x) => x.v))) * 100}%"></i></span><span class="v">${fmt(r.v)} / ${fmt(r.u)}</span>`).join('')}</div>`)}
      </div>
      <footer>원자료는 13개월만 보관하고 지웁니다. 이름·IP·쿠키·검색어는 모으지 않습니다. 브라우저 ‘추적 안 함’이 켜진 방문은 빠져 있습니다.</footer>`;
  }
  const seg = (id, k) => $(id).addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; $(id).querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); st[k] = k === 'days' ? +b.dataset.v : b.dataset.v; load(); });
  seg('#days', 'days'); seg('#site', 'site');
  $('#keyf').addEventListener('submit', (e) => { e.preventDefault(); st.key = $('#key').value.trim(); try { localStorage.setItem('dt-stats-key', st.key); } catch (er) { /* 저장 안 됨 */ } load(); });
  load();
})();
</script>
</body>
</html>
